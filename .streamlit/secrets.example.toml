# Copie para .streamlit/secrets.toml e preencha com valores reais.
# O secrets.toml NUNCA vai para o Git (está no .gitignore).

[database]
path = "data/ariam_pu.db"

[weather]
latitude = -23.31028
longitude = -51.16278

[processo]
# Pasta onde fica a planilha controlada 59001000100_Parametros_e_Massas_PU_RevNN_AAAA-MM-DD.xlsx.
# O app usa sempre a de maior número de revisão.
pasta_planilhas = "."
# Cabeçalho da coluna do regime na aba Parâmetros (linha 8) — regime em uso na fábrica.
regime = "n-Pentano 9,15% (provisório)"
maquina_cab1 = "Cabeçote 1 (RFG) — Krauss Maffei 40/40"
maquina_cab2 = "Cabeçote 2 — Krauss Maffei 80/80"
# Limites da SUGESTÃO de massa frio/calor pela temperatura externa (a supervisão decide).
limite_frio_c = 22.0
limite_calor_c = 28.0

[smtp]
host = "smtp.gmail.com"
port = 587
username = "seu_email@dominio.com"
password = "SUA_SENHA_DE_APP"
use_tls = true

# Destinatários dos e-mails de anomalia: "Nome (Cargo)" = "email"
[anomalias.destinatarios]
"Fulano de Tal (Gerente Qualidade)" = "fulano@exemplo.com"

# Usuários: gere o hash com
#   python -c "from src.auth_service import AuthService; print(AuthService.hash_password('SENHA'))"
# role: "admin" (altera cadastros) ou "operador" (consulta e lança)
[users.admin]
password_hash = "pbkdf2_sha256$260000$SEU_SALT$SEU_HASH"
role = "admin"

[users.operador1]
password_hash = "pbkdf2_sha256$260000$SEU_SALT$SEU_HASH"
role = "operador"
