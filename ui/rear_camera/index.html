<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font: 16px sans-serif; color: #262730; }
    button, select { font: inherit; padding: .65rem; margin: .3rem .3rem .3rem 0; max-width: 100%; }
    video, img { display: block; max-width: 100%; max-height: 360px; margin-top: .5rem; }
    [hidden] { display: none !important; }
    #status { white-space: pre-wrap; line-height: 1.4; }
  </style>
</head>
<body>
  <section id="camera" hidden aria-label="Captura de evidência">
    <button id="start" type="button">Tirar foto com câmera traseira</button>
    <label id="devices-label" hidden>Câmera:
      <select id="devices" aria-label="Selecionar câmera"></select>
    </label>
    <video id="video" autoplay muted playsinline hidden></video>
    <button id="capture" type="button" hidden>Capturar foto</button>
    <button id="stop" type="button" hidden>Cancelar / desligar câmera</button>
    <img id="preview" alt="Foto capturada — confira antes de salvar" hidden>
    <button id="clear" type="button" hidden>Remover foto</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <script src="./camera.js"></script>
</body>
</html>
